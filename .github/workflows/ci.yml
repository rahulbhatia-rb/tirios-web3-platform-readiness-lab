name: web3-platform-ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./...
      - run: go vet ./...
      - run: go run ./cmd/readiness -contract examples/property-prod.json
      - name: Unsafe MVP must be rejected
        run: |
          if go run ./cmd/readiness -contract examples/unsafe-mvp.json; then
            echo "unsafe MVP unexpectedly passed"
            exit 1
          fi
